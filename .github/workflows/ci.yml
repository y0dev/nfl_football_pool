name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real PostgreSQL for the SQL tests that also run against it (PGlite's
    # millisecond clock can hide timing bugs) — see
    # tests/unit/helpers/real-postgres.ts.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Scores/winners recalculation, Survivor finalization and pick
      # replacement, ESPN date fetching. Runs the real migration SQL in
      # in-process Postgres (PGlite); needs no secrets or network. Tests that
      # also target real Postgres use the service container above.
      - run: npm run test:unit
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  edge-functions:
    name: Edge Functions (Deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Type-check Edge Functions
        working-directory: supabase
        run: |
          echo '{"nodeModulesDir":"auto"}' > deno.json
          deno check functions/*/index.ts functions/_shared/*.ts
