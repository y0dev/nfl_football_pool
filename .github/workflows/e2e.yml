name: E2E

# Playwright suite against a real Supabase project. Scheduled and manual only:
# it needs secrets (unavailable to fork PRs) and writes real rows, so it is
# not a required PR check. Point the secrets at a NON-production project —
# global setup seeds demo accounts and teardown sweeps "E2E "-prefixed data.
on:
  schedule:
    # Daily at 12:00 UTC = 6:00 AM Central Standard Time (7:00 AM during CDT,
    # mid-March to early November). GitHub cron is UTC-only.
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright (chromium)
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.57 can't install
    # Chromium on. Move forward together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
      E2E_SKIP_STRIPE: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # Test-side name for the same key (tests/e2e read this one).
      NEXT_PUBLIC_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      POOL_ACCESS_SECRET: ${{ secrets.E2E_POOL_ACCESS_SECRET }}
      SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
      DEV_MASTER_KEY: ${{ secrets.E2E_DEV_MASTER_KEY }}
      # Dev-only test hooks the specs rely on (the debug panel's "force show
      # picks form" etc.) — same values as a local .env.local. All of them are
      # ignored outside NODE_ENV=development, which `npm run dev` here is.
      NEXT_PUBLIC_SHOW_DEBUG_PANEL: 'true'
      NEXT_PUBLIC_PICKS_DEV: 'true'
      NEXT_PUBLIC_WEEK_UNLOCKS: 'true'
      NEXT_PUBLIC_SIMULATE_PICKS: 'false'
    steps:
      - name: Require secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::E2E_SUPABASE_URL / E2E_SUPABASE_SERVICE_ROLE_KEY secrets are not set"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
